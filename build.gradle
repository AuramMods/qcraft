plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7.38'
}

version = mod_version
group = maven_group

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

sourceSets {
    gameTest {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += main.output + main.runtimeClasspath
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        configureEach {
            property 'forge.enabledGameTestNamespaces', 'qcraft'
            mods {
                qcraft { source sourceSets.main }
            }
        }
        client {
            workingDirectory project.file('run/client')
        }
        server {
            workingDirectory project.file('run/server')
            args '--nogui'
        }
        gameTestServer {
            workingDirectory project.file('run/gametest')
            mods {
                qcraft { source sourceSets.gameTest }
            }
        }
    }
}

mixin {
    add sourceSets.main, 'qcraft.refmap.json'
    config 'qcraft.mixins.json'
}

repositories {
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven {
        url = 'https://www.cursemaven.com'
        content { includeModule 'curse.maven', 'patchouli-306770' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    runtimeOnly fg.deobf("curse.maven:patchouli-306770:${patchouli_curse_file}")
}

tasks.named('processResources', ProcessResources).configure {
    inputs.properties version: project.version, patchouli_version: patchouli_version
    filesMatching('META-INF/mods.toml') {
        expand version: project.version, patchouli_version: patchouli_version
    }
}

tasks.named('jar', Jar).configure {
    from('LICENSE') { rename { 'LICENSE_qcraft' } }
    manifest.attributes('Implementation-Version': project.version)
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
